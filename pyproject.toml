[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "calboard"
version = "0.1.0"
description = "A colorful wall calendar / family command center for a Raspberry Pi + monitor (Skylight-style)."
requires-python = ">=3.9"
dependencies = [
    "flask>=2.2",
    "pyyaml>=6.0",
    "requests>=2.28",
    "icalendar>=5.0",
    "recurring-ical-events>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
calboard-web = "calboard.web.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
