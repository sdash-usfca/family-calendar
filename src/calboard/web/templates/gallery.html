<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gallery</title>
  <style>
    *{box-sizing:border-box; margin:0; padding:0}
    html,body{height:100%; overflow:hidden; background:#0a0a0c; color:#fff;
      font-family:-apple-system,"Segoe UI",system-ui,Roboto,sans-serif; -webkit-font-smoothing:antialiased;}
    .wrap{display:flex; height:100vh; width:100vw;}

    /* ---- 75% photo slideshow ---- */
    .photo{position:relative; flex:4 1 0; min-width:0; background:#000; overflow:hidden;}
    .photo .ph{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
      opacity:0; transition:opacity 1.3s ease; will-change:opacity,transform;}
    .photo .ph.show{opacity:1; animation:kb 18s ease-in-out forwards;}
    @keyframes kb{0%{transform:scale(1.02)} 100%{transform:scale(1.12)}}
    #empty{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; text-align:center; padding:6%;}
    #empty h2{font-size:min(4vh,4vw); font-weight:800}
    #empty p{color:rgba(255,255,255,.6); font-size:min(2.4vh,2.4vw); max-width:26ch; line-height:1.5}
    #empty img{width:200px; height:200px; border-radius:16px; background:#fff; padding:10px}
    #empty .url{font-family:ui-monospace,monospace; color:#fff; font-size:1.8vh; margin-top:4px}
    /* persistent little "add photos" QR, always visible over the slideshow */
    #addchip{position:absolute; left:18px; bottom:18px; display:none; align-items:center; gap:10px;
      background:rgba(0,0,0,.42); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.14);
      border-radius:14px; padding:8px 12px 8px 8px;}
    #addchip img{width:64px; height:64px; border-radius:8px; background:#fff; padding:4px; display:block}
    #addchip .t{font-size:13px; font-weight:700; line-height:1.25}
    #addchip .t small{display:block; font-weight:500; color:rgba(255,255,255,.6); font-size:11px}

    /* ---- 25% rail: YouTube (top) + Spotify (bottom) ---- */
    .rail{flex:1 1 0; min-width:0; display:flex; flex-direction:column; background:#0e0e12; border-left:1px solid rgba(255,255,255,.08);}
    .cell{flex:1 1 0; min-height:0; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:6% 8%; text-align:center;}
    .cell.yt{flex:0.9 1 0; border-bottom:1px solid rgba(255,255,255,.08); background:radial-gradient(120% 90% at 50% 30%, rgba(255,0,0,.10), transparent 70%);}
    .cell.sp{background:radial-gradient(120% 90% at 50% 70%, rgba(30,215,96,.10), transparent 70%);}
    .cell.news{flex:1.3 1 0; justify-content:flex-start; padding-top:30px; border-bottom:1px solid rgba(255,255,255,.08); background:radial-gradient(120% 80% at 50% 18%, rgba(90,130,255,.10), transparent 70%);}
    /* Family Notes + This Week cells (moved off the Hub) */
    .cell.notes, .cell.meals{ justify-content:flex-start; align-items:stretch; gap:10px; padding:20px 16px; border-bottom:1px solid rgba(255,255,255,.08);}
    .cell.notes{ flex:1.1 1 0; background:radial-gradient(120% 90% at 50% 40%, rgba(236,150,90,.12), transparent 72%);}
    .cell.meals{ flex:1.3 1 0; background:radial-gradient(120% 90% at 50% 55%, rgba(120,200,140,.12), transparent 72%); border-bottom:none;}
    .railhead{ font-size:min(2.2vh,13px); letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.5); font-weight:700; text-align:center; flex:none;}
    .notelist{ display:flex; flex-direction:column; gap:9px; overflow:hidden; width:100%;}
    .notelist .n{ font-size:min(2.6vh,17px); line-height:1.3; color:rgba(255,255,255,.9); border-left:3px solid rgba(236,150,90,.7); padding-left:10px;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
    .meallist{ display:flex; flex-direction:column; width:100%; overflow:hidden;}
    .mealrow{ display:flex; align-items:baseline; gap:10px; padding:5px 2px; border-bottom:1px solid rgba(255,255,255,.07);}
    .mealrow .d{ flex:none; width:36px; font-size:min(1.9vh,12px); font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:rgba(255,255,255,.4);}
    .mealrow .m{ flex:1; min-width:0; font-size:min(2.4vh,16px); color:rgba(255,255,255,.85); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
    .mealrow.today .d{ color:#8fd6ab;} .mealrow.today .m{ color:#eaffe9; font-weight:700;}
    .railempty{ color:rgba(255,255,255,.4); font-size:min(2.2vh,14px); text-align:center; padding-top:8px;}
    .newshead{font-size:min(2.4vh,14px); letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.45); font-weight:700; margin-bottom:1.6vh}
    .newsbody{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; width:100%; transition:opacity .45s ease}
    .newsbody .nt{font-weight:800; font-size:min(4vh,27px); line-height:1.28; text-wrap:balance; max-width:100%}
    .newsbody .nsum{font-size:min(3vh,20px); color:rgba(255,255,255,.78); line-height:1.42; max-width:100%; text-wrap:pretty;
      display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; overflow:hidden}
    .newsbody .ns{font-size:min(2.2vh,15px); color:rgba(255,255,255,.5); font-weight:600}
    .cell .logo{width:min(8vh,58px); height:min(8vh,58px); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:min(4.5vh,30px); font-weight:900; flex:none;}
    .cell.yt .logo{background:#ff0000; color:#fff;} .cell.sp .logo{background:#1ed760; color:#0a0a0c;}
    .cell .name{font-weight:800; font-size:min(2.7vh,20px); letter-spacing:.02em; max-width:100%; text-align:center}
    .cell .sub{color:rgba(255,255,255,.5); font-size:min(1.8vh,13px); line-height:1.35; max-width:100%; text-align:center}
    .clock{position:absolute; top:12px; left:0; right:0; text-align:center; color:rgba(255,255,255,.28); font-size:12px; letter-spacing:.15em; text-transform:uppercase; z-index:2}
    /* stack panel contents cleanly in the narrow rail */
    #ytph, #spidle{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; width:100%; padding:12% 8%;}
    /* YouTube live embed fills the cell */
    #ytframe{position:absolute; inset:0; width:100%; height:100%; border:0; display:none; background:#000;}
    .cornerqr{width:72%; max-width:120px; aspect-ratio:1; border-radius:10px; background:#fff; padding:6px; display:none}
    /* Spotify now-playing */
    #spnow{display:none; flex-direction:column; align-items:center; justify-content:center; gap:10px; width:100%; padding:12% 8%;}
    #spnow .art{width:72%; max-width:120px; aspect-ratio:1; border-radius:12px; background:#1a1a1e center/cover no-repeat; box-shadow:0 10px 30px rgba(0,0,0,.5)}
    #spnow .track{font-weight:800; font-size:min(2.4vh,17px); line-height:1.2; max-width:96%}
    #spnow .artist{color:rgba(255,255,255,.55); font-size:min(1.9vh,13px)}
    #spnow .cta{margin-top:4px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#1ed760; font-weight:700}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="photo">
      <img id="imgA" class="ph" alt="">
      <img id="imgB" class="ph" alt="">
      <div id="empty">
        <h2>Your photo gallery</h2>
        <p>Upload photos from your phone and they'll drift by here.</p>
        <img id="qr" alt="upload QR">
        <div class="url" id="url"></div>
      </div>
      <div id="addchip"><img id="qr2" alt=""><div class="t">Add photos<small id="chipurl"></small></div></div>
    </div>

    <div class="rail">
      <div class="cell news">
        <div class="clock" id="clk"></div>
        <div class="newshead">📰 Headlines</div>
        <div class="newsbody" id="newsbody">
          <div class="nt" id="nt">Loading news…</div>
          <div class="nsum" id="nsum"></div>
          <div class="ns" id="ns"></div>
        </div>
      </div>
      <div class="cell yt">
        <div id="ytph">
          <div class="logo">▶</div>
          <div class="name">YouTube</div>
          <img id="ytqr" class="cornerqr" alt="">
          <div class="sub">Scan to send a video</div>
        </div>
        <iframe id="ytframe" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>
      <div class="cell notes">
        <div class="railhead">💌 Family Notes</div>
        <div class="notelist" id="notelist"><div class="railempty">…</div></div>
      </div>
    </div>
  </div>

  <script>
    const imgA=document.getElementById('imgA'), imgB=document.getElementById('imgB'),
          empty=document.getElementById('empty'), addchip=document.getElementById('addchip');
    let photos=[], idx=0, useA=true, addUrl='', photosKey='';
    const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

    function qrFor(url){ return 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(url); }
    function showEmpty(on){
      empty.style.display = on ? 'flex' : 'none';
      addchip.style.display = on ? 'none' : 'flex';
      if(addUrl){
        document.getElementById('qr').src = qrFor(addUrl);
        document.getElementById('url').textContent = addUrl.replace(/^https?:\/\//,'');
        document.getElementById('qr2').src = qrFor(addUrl);
        document.getElementById('chipurl').textContent = addUrl.replace(/^https?:\/\//,'');
      }
    }
    function swapTo(n){
      if(!photos.length) return;
      const next = useA ? imgB : imgA, cur = useA ? imgA : imgB;
      next.onload = () => { next.classList.add('show'); cur.classList.remove('show'); useA=!useA; };
      next.classList.remove('show'); next.src = '/media/' + encodeURIComponent(photos[n]);
    }
    function advance(){ if(photos.length){ idx=(idx+1)%photos.length; swapTo(idx); } }
    async function loadPhotos(){
      try{
        const d = await fetch('/api/photos',{cache:'no-store'}).then(r=>r.json());
        addUrl = d.add_url || '';
        const list = d.photos || [];
        // Re-shuffle only when the SET of photos actually changes (incl. first load),
        // not on every poll — so the order stays put but each gallery visit is random.
        const key = list.slice().sort().join('|');
        if(key !== photosKey){
          photosKey = key; photos = shuffle(list.slice()); idx = 0;
          if(!photos.length){ showEmpty(true); imgA.classList.remove('show'); imgB.classList.remove('show'); }
          else { showEmpty(false); swapTo(0); }
        }
      }catch(e){}
    }

    // ---- YouTube corner ----
    const ytframe=document.getElementById('ytframe'), ytph=document.getElementById('ytph');
    let lastYt=null;
    async function loadYouTube(){
      try{
        const d = await fetch('/api/youtube',{cache:'no-store'}).then(r=>r.json());
        if(d.remote_url){ const q=document.getElementById('ytqr'); q.src=qrFor(d.remote_url); q.style.display='block'; }
        const id = d.id || '';
        if(id===lastYt) return; lastYt=id;
        if(id){ ytframe.src='https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0&modestbranding=1&playsinline=1';
          ytframe.style.display='block'; ytph.style.display='none'; }
        else { ytframe.src='about:blank'; ytframe.style.display='none'; ytph.style.display='flex'; }
      }catch(e){}
    }

    function tickClock(){ const d=new Date(); let h=d.getHours()%12||12;
      document.getElementById('clk').textContent = h+':'+String(d.getMinutes()).padStart(2,'0'); }

    // ---- Family Notes (moved off the Hub) ----
    async function loadNotesCell(){ try{
      const d=await fetch('/api/notes',{cache:'no-store'}).then(r=>r.json());
      const items=(d.items||[]).slice(-6).reverse();
      document.getElementById('notelist').innerHTML = items.length
        ? items.map(it=>`<div class="n">${esc(it.name||it.text||'')}</div>`).join('')
        : '<div class="railempty">No notes yet — post one from your phone 💌</div>';
    }catch(e){} }


    // ---- News headlines (rotating) ----
    let news=[], ni=0; const newsbody=document.getElementById('newsbody');
    async function loadNews(){ try{ const d=await fetch('/api/news',{cache:'no-store'}).then(r=>r.json()); if(d.items&&d.items.length) news=d.items; }catch(e){} }
    function showNews(){ if(!news.length) return; const it=news[ni++%news.length];
      newsbody.style.opacity='0';
      setTimeout(()=>{
        document.getElementById('nt').textContent=it.title;
        document.getElementById('nsum').textContent=it.summary||'';
        document.getElementById('ns').textContent=it.source||'';
        newsbody.style.opacity='1';
      }, 400);
    }

    loadPhotos(); setInterval(loadPhotos, 30000); setInterval(advance, 8000);
    loadYouTube(); setInterval(loadYouTube, 3000);
    loadNews().then(()=>setTimeout(showNews, 300)); setInterval(loadNews, 600000); setInterval(showNews, 30000);
    loadNotesCell(); setInterval(loadNotesCell, 30000);
    tickClock(); setInterval(tickClock, 15000);

    const MODE_URL={hub:'/',music:'/music',gallery:'/gallery',youtube:'/youtube'};
    setInterval(async()=>{ try{
      const d=await(await fetch('/api/mode',{cache:'no-store'})).json();
      const u=MODE_URL[d.view||d.mode]; if(u&&u!==location.pathname) location.href=u;
    }catch(e){} },2000);
  </script>
  <div id="nightdim" style="position:fixed;inset:0;z-index:9999;background:#000;opacity:0;pointer-events:none;transition:opacity 4s ease"></div>
  <script>
    (function(){ function nd(){ var h=new Date().getHours(); document.getElementById('nightdim').style.opacity=(h<7)?'0.82':'0'; } nd(); setInterval(nd,60000); })();
    (function(){ function hb(){ fetch('/api/heartbeat',{method:'POST',cache:'no-store'}).catch(function(){}); } hb(); setInterval(hb,30000); })();
  </script>
</body>
</html>
