<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Photo Gallery</title>
  <style>
    :root{ --bg:#f7f2e9; --card:#fff; --ink:#2a2620; --muted:#8c8271; --line:#ece2ce; --accent:#d1603f; }
    @media (prefers-color-scheme: dark){
      :root{ --bg:#1c1a17; --card:#262320; --ink:#f0e9dd; --muted:#a89a86; --line:#39332b; --accent:#e5794f; }
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
    body{margin:0 auto; max-width:560px; background:var(--bg); color:var(--ink); padding:20px 16px 44px;
      font-family:-apple-system,"Segoe UI",system-ui,Roboto,sans-serif;}
    h1{font-size:23px; margin:2px 0 6px; display:flex; align-items:center; gap:9px}
    p.sub{color:var(--muted); font-size:14px; margin:0 0 18px}
    .add{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:18px;
      border:2px dashed var(--line); border-radius:16px; background:var(--card); color:var(--accent);
      font-size:17px; font-weight:700; cursor:pointer;}
    input[type=file]{display:none}
    .bar{display:flex; align-items:center; justify-content:space-between; margin:20px 2px 10px; color:var(--muted); font-size:14px}
    .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
    .cell{position:relative; aspect-ratio:1; border-radius:12px; overflow:hidden; background:var(--line)}
    .cell img{width:100%; height:100%; object-fit:cover; display:block}
    .cell .del{position:absolute; top:5px; right:5px; width:26px; height:26px; border-radius:50%; border:none;
      background:rgba(0,0,0,.55); color:#fff; font-size:16px; line-height:1; cursor:pointer;}
    .empty{color:var(--muted); text-align:center; padding:40px 0; font-size:15px}
    #status{font-size:14px; color:var(--accent); font-weight:600; min-height:18px; margin-top:8px; text-align:center}
  </style>
</head>
<body>
  <h1>🖼️ Photo Gallery</h1>
  <p class="sub">Photos you add here drift across the wall in Gallery mode.</p>

  <label class="add" for="file">➕ Add photos</label>
  <input type="file" id="file" accept="image/*" multiple>
  <div id="status"></div>

  <div class="bar"><span id="count"></span><span>tap ✕ to remove</span></div>
  <div class="grid" id="grid"><div class="empty">Loading…</div></div>

  <script>
    const grid=document.getElementById('grid'), statusEl=document.getElementById('status'),
          countEl=document.getElementById('count'), fileInput=document.getElementById('file');

    function render(photos){
      countEl.textContent = photos.length ? `${photos.length} photo${photos.length!==1?'s':''}` : '';
      grid.innerHTML = photos.length ? photos.map(p => `
        <div class="cell">
          <img src="/media/${encodeURIComponent(p)}" alt="" loading="lazy">
          <button class="del" data-name="${p}" aria-label="delete">✕</button>
        </div>`).join('') : `<div class="empty">No photos yet — tap “Add photos”.</div>`;
    }
    async function load(){ try{ render((await (await fetch('/api/photos',{cache:'no-store'})).json()).photos||[]); }catch(e){} }

    fileInput.addEventListener('change', async () => {
      const files = fileInput.files; if(!files || !files.length) return;
      statusEl.textContent = `Uploading ${files.length}…`;
      const fd = new FormData();
      for(const f of files) fd.append('photos', f);
      try{
        const d = await (await fetch('/api/photos/upload', {method:'POST', body:fd})).json();
        statusEl.textContent = `Added ${(d.saved||[]).length} ✓`;
        render(d.photos||[]);
      }catch(e){ statusEl.textContent = 'Upload failed — try again.'; }
      fileInput.value = '';
      setTimeout(()=>statusEl.textContent='', 2500);
    });

    grid.addEventListener('click', async e => {
      const b = e.target.closest('[data-name]'); if(!b) return;
      const d = await (await fetch('/api/photos/delete', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({name: b.dataset.name})})).json();
      render(d.photos||[]);
    });

    load();
  </script>
</body>
</html>
