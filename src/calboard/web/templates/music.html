<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Now Playing</title>
  <style>
    :root{
      --ink:#fff; --dim:rgba(255,255,255,.45); --dimmer:rgba(255,255,255,.26);
      --c1:#3a2a6d; --c2:#7d3a6d; --c3:#c2543f; --c4:#245a7d;
    }
    *{box-sizing:border-box; margin:0; padding:0}
    html,body{height:100%; overflow:hidden; background:#07070a; color:var(--ink);
      font-family:-apple-system,"Segoe UI",system-ui,Roboto,"Helvetica Neue",sans-serif; -webkit-font-smoothing:antialiased;}

    /* ---------- Backdrop (theme-driven) ---------- */
    #aura{position:fixed; inset:0; z-index:0; overflow:hidden; background:#07070a; transition:background 1s ease;}
    #aura.pulse{animation:pulse .7s ease}
    @keyframes pulse{0%{transform:scale(1)} 32%{transform:scale(1.03)} 100%{transform:scale(1)}}
    .blob{position:absolute; width:82vmax; height:82vmax; border-radius:50%; filter:blur(56px);
      opacity:.78; mix-blend-mode:screen; will-change:transform; transition:background 1s ease;}
    .b1{background:radial-gradient(circle,var(--c1),transparent 60%); left:-16vmax; top:-18vmax; animation:d1 15s ease-in-out infinite}
    .b2{background:radial-gradient(circle,var(--c2),transparent 60%); right:-18vmax; top:-12vmax; animation:d2 19s ease-in-out infinite}
    .b3{background:radial-gradient(circle,var(--c3),transparent 60%); left:-4vmax; bottom:-22vmax; animation:d3 17s ease-in-out infinite}
    .b4{background:radial-gradient(circle,var(--c4),transparent 60%); right:-8vmax; bottom:-16vmax; animation:d4 21s ease-in-out infinite}
    @keyframes d1{0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(28vw,22vh) scale(1.4)}}
    @keyframes d2{0%,100%{transform:translate(0,0) scale(1.15)} 50%{transform:translate(-26vw,24vh) scale(.82)}}
    @keyframes d3{0%,100%{transform:translate(0,0) scale(.92)} 50%{transform:translate(24vw,-22vh) scale(1.45)}}
    @keyframes d4{0%,100%{transform:translate(0,0) scale(1.12)} 50%{transform:translate(-28vw,-18vh) scale(.88)}}

    /* Theme: CLOUDS — dreamy dusk sky with soft white puffs */
    body[data-theme=clouds] #aura{background:linear-gradient(180deg,#20305e 0%,#42476f 38%,#7b6a8f 68%,#c99f86 100%);}
    body[data-theme=clouds] .blob{background:radial-gradient(circle,rgba(255,255,255,.92),transparent 62%); opacity:.55; filter:blur(46px);}
    /* Theme: NIGHT — deep glow from below */
    body[data-theme=night] #aura{background:radial-gradient(125% 105% at 50% 118%, var(--c1), #05060a 58%);}
    body[data-theme=night] .blob{opacity:.4; filter:blur(64px);}

    #fx{position:fixed; inset:0; z-index:1; pointer-events:none;}
    #shade{position:fixed; inset:0; z-index:2; pointer-events:none;
      background:radial-gradient(130% 100% at 50% 42%, transparent 45%, rgba(0,0,0,.5));}
    .stage{position:relative; z-index:3; height:100%;}

    /* ---------- Word-scatter lyrics (synced) ---------- */
    #wordsView{position:absolute; inset:0; display:none;}
    #words{position:absolute; left:0; right:0; top:6vh; bottom:14vh;}
    #words .w{font-weight:800; letter-spacing:-.01em; color:#fff; white-space:nowrap; opacity:0;
      text-shadow:0 3px 30px rgba(0,0,0,.55); will-change:transform,opacity;}
    /* scatter — random positions, pop in (unordered) */
    #words.scatter .w{position:absolute; --rot:0deg; transform:translate(-50%,-50%) scale(.5) rotate(var(--rot));}
    #words.scatter .w.in{animation:sIn .62s cubic-bezier(.2,.75,.25,1.25) forwards}
    @keyframes sIn{to{opacity:1; transform:translate(-50%,-50%) scale(1) rotate(var(--rot))}}
    /* row styles — centered wrapped line, sequential (in reading order) */
    #words.row{display:flex; flex-wrap:wrap; align-content:center; justify-content:center; gap:.12em .4em; padding:6vh 8vw; height:100%;}
    #words.row .w{position:relative; font-size:min(6.6vh,5vw); line-height:1.12;}
    #words.rise .w{transform:translateY(54px) scale(.94)}
    #words.rise .w.in{animation:riseIn .55s cubic-bezier(.2,.8,.2,1.1) forwards}
    @keyframes riseIn{to{opacity:1; transform:translateY(0) scale(1)}}
    #words.slide .w{transform:translateX(-90px)}
    #words.slide .w.in{animation:slideIn .5s cubic-bezier(.2,.8,.25,1) forwards}
    @keyframes slideIn{to{opacity:1; transform:translateX(0)}}
    #words.cascade .w{transform:scale(.5)}
    #words.cascade .w.in{animation:popIn .42s cubic-bezier(.2,.8,.2,1.3) forwards}
    @keyframes popIn{to{opacity:1; transform:scale(1)}}

    /* ---------- Plain lyrics (gentle scroll) ---------- */
    #plainView{position:absolute; inset:0; overflow:hidden; display:none;}
    #plainScroll{position:absolute; left:0; right:0; top:10vh; padding:0 8vw; transition:transform .5s linear; text-align:center;}
    .pline{font-weight:700; font-size:min(4.4vh,3.5vw); line-height:1.55; color:rgba(255,255,255,.92);
      padding:.4vh 0; text-wrap:balance; text-shadow:0 2px 30px rgba(0,0,0,.45);}
    .pline.blank{height:2vh}

    /* ---------- Card / idle ---------- */
    #cardView{position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:3.4vh; padding:6vw;}
    #cardArt{width:min(42vh,60vw); aspect-ratio:1; border-radius:20px; background:#1a1a1e center/cover no-repeat; box-shadow:0 30px 90px rgba(0,0,0,.6);}
    #cardTitle{font-weight:800; font-size:min(5vh,7vw); line-height:1.1; text-align:center; max-width:82%; text-wrap:balance}
    #cardArtist{margin-top:1.2vh; font-size:min(2.8vh,4.5vw); color:var(--dim); font-weight:600; text-align:center}
    #cardHint{margin-top:2vh; font-size:1.7vh; color:var(--dimmer); letter-spacing:.12em; text-transform:uppercase}
    #idleView{position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;}
    #clock{font-weight:800; font-size:18vh; line-height:1; letter-spacing:-.02em}
    #idleDate{font-size:3.2vh; color:var(--dim); font-weight:600; margin-top:1vh}
    #idleNote{margin-top:4vh; font-size:2vh; color:var(--dimmer); letter-spacing:.1em; text-transform:uppercase}

    /* ---------- Now-playing bar ---------- */
    #bar{position:absolute; left:0; right:0; bottom:0; z-index:4; display:none; align-items:center; gap:16px; padding:18px 30px 26px;}
    #barArt{width:56px; height:56px; border-radius:11px; background:#1a1a1e center/cover no-repeat; flex:none; box-shadow:0 6px 20px rgba(0,0,0,.55)}
    #barMeta{flex:1; min-width:0}
    #barTitle{font-weight:700; font-size:20px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    #barArtist{font-size:15px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px}
    .badge{font-size:12px; color:var(--dimmer); letter-spacing:.14em; text-transform:uppercase; flex:none}
    #prog{position:absolute; left:0; right:0; bottom:0; height:4px; background:rgba(255,255,255,.14)}
    #progFill{height:100%; width:0; background:#fff; transition:width .3s linear}
  </style>
</head>
<body data-theme="aurora">
  <div id="aura"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div></div>
  <canvas id="fx"></canvas>
  <div id="shade"></div>

  <div class="stage">
    <div id="wordsView"><div id="words"></div></div>
    <div id="plainView"><div id="plainScroll"></div></div>
    <div id="cardView">
      <div id="cardArt"></div><div id="cardTitle">—</div><div id="cardArtist"></div><div id="cardHint">now playing</div>
    </div>
    <div id="idleView"><div id="clock">--:--</div><div id="idleDate"></div><div id="idleNote">♪ play something on Spotify</div></div>
  </div>
  <div id="bar">
    <div id="barArt"></div>
    <div id="barMeta"><div id="barTitle"></div><div id="barArtist"></div></div>
    <div class="badge">Spotify</div>
    <div id="prog"><div id="progFill"></div></div>
  </div>

  <script>
    const el=id=>document.getElementById(id);
    const aura=el('aura'), wordsView=el('wordsView'), wordsEl=el('words'),
          plainView=el('plainView'), plainScroll=el('plainScroll'),
          cardView=el('cardView'), idleView=el('idleView'), bar=el('bar');

    const S={ trackId:null, playing:false, progress:0, duration:0, polledAt:0,
              synced:[], plain:[], activeIdx:-2, mode:null, art:null, theme:'aurora' };
    const DEFAULT_PALETTE=['#3a2a6d','#7d3a6d','#c2543f','#245a7d'];
    let pal=DEFAULT_PALETTE.slice(), pulseT=-9999;

    // ----- Themes (rotate per song) -----
    const THEME_ORDER=['aurora','clouds','night'];
    const THEME_CFG={
      aurora:{ color:'palette', count:1.0, vy:[.06,.28], size:[36,140] },
      clouds:{ color:'white',   count:0.7, vy:[.03,.13], size:[70,190] },
      night:{  color:'palette', count:1.5, vy:[.04,.20], size:[8,46] },
    };
    let cfg=THEME_CFG.aurora;
    const hashStr=s=>{ let h=0; for(let i=0;i<(s||'').length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h); };
    function applyTheme(t){ S.theme=t; cfg=THEME_CFG[t]||THEME_CFG.aurora; document.body.dataset.theme=t; initParticles(); }

    // ----- Palette from album art -----
    function _rgb(s){ const m=/(\d+)\D+(\d+)\D+(\d+)/.exec(s||''); return m?[+m[1],+m[2],+m[3]]:[90,80,140]; }
    function _hsl([r,g,b]){ r/=255;g/=255;b/=255; const mx=Math.max(r,g,b),mn=Math.min(r,g,b); let h=0,s=0,l=(mx+mn)/2;
      if(mx!==mn){ const d=mx-mn; s=l>.5?d/(2-mx-mn):d/(mx+mn); h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4; h/=6;} return [h*360,s,l]; }
    function _toRgb(h,s,l){ h=((h%360)+360)%360/360; const f=(p,q,t)=>{t=(t+1)%1; return t<1/6?p+(q-p)*6*t:t<.5?q:t<2/3?p+(q-p)*(2/3-t)*6:p;};
      let r,g,b; if(s===0){r=g=b=l;} else{ const q=l<.5?l*(1+s):l+s-l*s,p=2*l-q; r=f(p,q,h+1/3);g=f(p,q,h);b=f(p,q,h-1/3);} return `rgb(${r*255|0},${g*255|0},${b*255|0})`; }
    function applyPalette(cols){
      let list;
      if(!cols||!cols.length) list=DEFAULT_PALETTE.slice();
      else{ let [h,s,l]=_hsl(_rgb(cols[0])); s=Math.min(1,Math.max(.6,s)); l=Math.min(.6,Math.max(.44,l)); list=[0,40,-34,74].map(o=>_toRgb(h+o,s,l)); }
      const r=document.documentElement.style; list.forEach((c,i)=>r.setProperty('--c'+(i+1),c)); pal=list;
    }
    function extractPalette(url){
      return new Promise(res=>{ if(!url) return res(null);
        const img=new Image(); img.crossOrigin='anonymous';
        img.onload=()=>{ try{
          const n=28,cv=document.createElement('canvas'); cv.width=n;cv.height=n;
          const ctx=cv.getContext('2d'); ctx.drawImage(img,0,0,n,n); const d=ctx.getImageData(0,0,n,n).data,bk={};
          for(let i=0;i<d.length;i+=4){ const r=d[i],g=d[i+1],b=d[i+2],bri=Math.max(r,g,b),sat=bri-Math.min(r,g,b);
            if(bri<30||bri>252) continue; const k=(r>>5)+'_'+(g>>5)+'_'+(b>>5); const o=bk[k]||(bk[k]={r:0,g:0,b:0,n:0,s:0});
            o.r+=r;o.g+=g;o.b+=b;o.n++;o.s+=sat+bri*.25; }
          let arr=Object.values(bk).map(o=>({r:o.r/o.n|0,g:o.g/o.n|0,b:o.b/o.n|0,s:o.s})); arr.sort((a,b)=>b.s-a.s);
          const picked=[]; for(const c of arr){ if(picked.length>=4) break;
            if(picked.every(p=>Math.abs(p.r-c.r)+Math.abs(p.g-c.g)+Math.abs(p.b-c.b)>64)) picked.push(c); }
          res(picked.length?picked.map(c=>`rgb(${c.r},${c.g},${c.b})`):null);
        }catch(e){ res(null); } };
        img.onerror=()=>res(null); img.src=url; });
    }
    function auraPulse(){ aura.classList.remove('pulse'); void aura.offsetWidth; aura.classList.add('pulse'); }

    // ----- Lyric helpers -----
    const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    const seeded=n=>{ const x=Math.sin(n*12.9898)*43758.5453; return x-Math.floor(x); };
    const two=n=>String(n).padStart(2,'0');
    const fmtClock=()=>{ const d=new Date(); return (d.getHours()%12||12)+':'+two(d.getMinutes()); };
    function estPos(){ let p=S.progress+(S.playing?(performance.now()-S.polledAt):0); return S.duration?Math.min(p,S.duration):p; }

    function setMode(m){ if(m===S.mode) return; S.mode=m;
      wordsView.style.display=m==='lyrics'?'block':'none';
      plainView.style.display=m==='plain'?'block':'none';
      cardView.style.display=m==='card'?'flex':'none';
      idleView.style.display=m==='idle'?'flex':'none';
      bar.style.display=m==='idle'?'none':'flex';
      if(m!=='lyrics') wordsEl.innerHTML='';
    }
    function setArt(url){ if(url===S.art) return; S.art=url; const v=url?`url("${url}")`:'';
      el('barArt').style.backgroundImage=v; el('cardArt').style.backgroundImage=v; }

    // ----- Lyric animation styles (cycle like themes) -----
    const STYLE_ORDER=['scatter','rise','slide','cascade'];
    let curStyle='scatter';
    function applyStyle(s){ curStyle=STYLE_ORDER.includes(s)?s:'scatter'; }
    const mkWord=w=>{ const s=document.createElement('span'); s.className='w'; s.textContent=w; return s; };
    function clearWords(){
      [...wordsEl.children].forEach(c=>{ c.style.animation='none'; c.style.transition='opacity .34s ease'; c.style.opacity='0'; setTimeout(()=>c.remove(),350); });
    }
    // Show the active line's words using the current animation style.
    function showWords(text, idx){
      clearWords();
      const words=(text||'').split(/\s+/).filter(Boolean);
      if(!words.length){ wordsEl.className='row cascade'; const s=mkWord('♪'); s.style.fontSize='8vh';
        wordsEl.appendChild(s); requestAnimationFrame(()=>s.classList.add('in')); return; }
      if(curStyle==='scatter'){
        wordsEl.className='scatter';
        const spanN=Math.min(1, words.length/6);        // tighter scatter for short lines
        words.forEach((w,i)=>{ const s=mkWord(w);
          const rx=seeded(idx*97+i*31), ry=seeded(idx*53+i*17+7), rz=seeded(idx*13+i*41+3);
          s.style.left=(50+(rx-.5)*58*spanN)+'%'; s.style.top=(50+(ry-.5)*54)+'%';
          s.style.fontSize=(4.4+rz*4.6)+'vh'; s.style.setProperty('--rot',((rz-.5)*14).toFixed(1)+'deg');
          s.style.animationDelay=(i*95)+'ms'; wordsEl.appendChild(s); requestAnimationFrame(()=>s.classList.add('in')); });
      } else {                                          // rise / slide / cascade — sequential row
        wordsEl.className='row '+curStyle;
        words.forEach((w,i)=>{ const s=mkWord(w); s.style.animationDelay=(i*85)+'ms';
          wordsEl.appendChild(s); requestAnimationFrame(()=>s.classList.add('in')); });
      }
    }
    function updateActiveLine(pos){
      const lines=S.synced; if(!lines.length) return;
      let idx=-1; for(let i=0;i<lines.length;i++){ if(lines[i].t<=pos+120) idx=i; else break; }
      if(idx===S.activeIdx) return; S.activeIdx=idx;
      if(idx>=0){ showWords(lines[idx].text, idx); auraPulse(); pulseT=performance.now(); }
      else wordsEl.innerHTML='';
    }

    function renderPlain(lines){ plainScroll.innerHTML=lines.map(t=>t?`<div class="pline">${esc(t)}</div>`:'<div class="pline blank"></div>').join(''); plainScroll.style.transform='translateY(0)'; }
    function updateProgress(pos){ if(S.duration) el('progFill').style.width=Math.max(0,Math.min(100,pos/S.duration*100))+'%'; }

    async function loadLyrics(np){
      S.synced=[]; S.plain=[]; S.activeIdx=-2; wordsEl.innerHTML=''; renderPlain([]);
      if(!np.id) return;
      const q=new URLSearchParams({track:np.track||'',artist:np.artists||'',album:np.album||'',duration_ms:np.duration_ms||0});
      try{ const d=await fetch('/api/lyrics?'+q).then(r=>r.json());
        S.synced=(d&&d.synced)||[]; S.plain=((d&&d.plain)||'').split('\n'); renderPlain(S.plain);
      }catch(e){ S.synced=[]; S.plain=[]; }
      decideMode();
    }
    function decideMode(){
      if(!S.trackId){ setMode('idle'); return; }
      if(S.synced.length) setMode('lyrics');
      else if(S.plain.some(l=>l.trim())) setMode('plain');
      else setMode('card');
    }

    async function poll(){
      let np=null; try{ np=await fetch('/api/nowplaying',{cache:'no-store'}).then(r=>r.json()); }catch(e){ return; }
      if(!np) return;
      if(np.id){
        const newTrack=np.id!==S.trackId; S.playing=!!np.is_playing;
        if(typeof np.progress_ms==='number'){ S.progress=np.progress_ms; S.polledAt=performance.now(); }
        if(np.duration_ms) S.duration=np.duration_ms;
        if(newTrack){
          S.trackId=np.id; setArt(np.art||null);
          el('cardTitle').textContent=np.track||'—'; el('cardArtist').textContent=np.artists||'';
          el('barTitle').textContent=np.track||''; el('barArtist').textContent=np.artists||'';
          extractPalette(np.art).then(c=>{ applyPalette(c); applyTheme(THEME_ORDER[hashStr(np.id)%THEME_ORDER.length]); });
          applyStyle(STYLE_ORDER[hashStr((np.id||'')+'s')%STYLE_ORDER.length]);
          loadLyrics(np);
        }
        decideMode();
      } else if(np.enabled && !np.error){ S.playing=false; S.trackId=null; S.synced=[]; S.plain=[]; decideMode(); }
    }
    function tick(){
      const pos=estPos();
      if(S.mode==='lyrics'){ updateActiveLine(pos); updateProgress(pos); }
      else if(S.mode==='plain'){ const f=S.duration?Math.min(1,pos/S.duration):0;
        const max=Math.max(0, plainScroll.scrollHeight - plainView.clientHeight*0.5);
        plainScroll.style.transform=`translateY(${-max*f}px)`; updateProgress(pos); }
      else if(S.mode==='card'){ updateProgress(pos); }
      else if(S.mode==='idle'){ el('clock').textContent=fmtClock();
        el('idleDate').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}); }
      requestAnimationFrame(tick);
    }

    // ----- Particles (theme-aware) -----
    const fx=el('fx'), fctx=fx.getContext('2d'); let particles=[];
    const rgba=(c,a)=>c.replace('rgb(','rgba(').replace(')',','+a+')');
    function initParticles(){
      const base=Math.max(16,Math.min(40,Math.round(innerWidth/34)));
      const n=Math.round(base*(cfg.count||1)); particles=[];
      for(let i=0;i<n;i++) particles.push({ x:Math.random()*innerWidth, y:Math.random()*innerHeight,
        r:cfg.size[0]+Math.random()*(cfg.size[1]-cfg.size[0]),
        vx:(Math.random()-.5)*.28, vy:-(cfg.vy[0]+Math.random()*(cfg.vy[1]-cfg.vy[0])),
        ci:i%4, a:.09+Math.random()*.15, ph:Math.random()*6.28 });
    }
    function sizeFx(){ fx.width=innerWidth; fx.height=innerHeight; initParticles(); }
    function drawFx(t){
      fctx.clearRect(0,0,fx.width,fx.height); fctx.globalCompositeOperation='screen';
      const pulse=Math.max(0,1-(performance.now()-pulseT)/700);
      for(const p of particles){
        p.x+=p.vx+Math.sin(t/2600+p.ph)*.16; p.y+=p.vy;
        if(p.y<-p.r){ p.y=innerHeight+p.r; p.x=Math.random()*innerWidth; }
        if(p.x<-p.r) p.x=innerWidth+p.r; else if(p.x>innerWidth+p.r) p.x=-p.r;
        const rr=p.r*(1+pulse*.16), col=cfg.color==='white'?'rgb(255,255,255)':pal[p.ci%pal.length];
        const g=fctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rr);
        g.addColorStop(0, rgba(col, Math.min(.5,p.a*(1+pulse*.6)).toFixed(3))); g.addColorStop(1, rgba(col,0));
        fctx.fillStyle=g; fctx.beginPath(); fctx.arc(p.x,p.y,rr,0,6.29); fctx.fill();
      }
      requestAnimationFrame(drawFx);
    }
    addEventListener('resize', sizeFx);

    // ---- Demo mode (?demo=1) — preview the animation with NO Spotify ----
    // Uses original placeholder lines (not any real song) on a loop, and cycles
    // through the themes so you can see all of them. ?theme=clouds pins one.
    function startDemo(themeParam, styleParam){
      const LINES=[
        {t:600, text:"Good morning to our little home"},
        {t:2800,text:"the coffee's warm, the windows glow"},
        {t:5000,text:"a note is waiting on the door"},
        {t:7300,text:"today is ours to shape once more"},
        {t:9700,text:"add the milk, remember bread"},
        {t:11900,text:"a busy little week ahead"},
        {t:14100,text:"but here we gather, here we stay"},
        {t:16300,text:"our calendar lights up the day"},
        {t:18700,text:"so press play and let it ring"},
        {t:20900,text:"watch the colors start to swing"},
        {t:23100,text:"every word will rise and fall"},
        {t:25300,text:"a little magic on the wall"},
      ];
      S.synced=LINES; S.plain=[]; S.trackId='demo'; S.playing=true;
      S.duration=LINES[LINES.length-1].t+2800;
      const themes=(themeParam&&THEME_ORDER.includes(themeParam))?[themeParam]:THEME_ORDER;
      const styles=(styleParam&&STYLE_ORDER.includes(styleParam))?[styleParam]:STYLE_ORDER;
      const bases=['rgb(126,92,226)','rgb(86,170,214)','rgb(150,86,180)','rgb(214,120,90)'];
      let ti=0, si=0; applyPalette([bases[0]]); applyTheme(themes[0]); applyStyle(styles[0]);
      const showLabel=()=>{ el('barTitle').textContent='Demo · '+styles[si]+' + '+themes[ti];
        el('barArtist').textContent='(preview · cycles automatically)'; };
      showLabel(); setMode('lyrics');
      const start=performance.now(); let lastPos=0;
      setInterval(()=>{
        const pos=(performance.now()-start)%S.duration;
        if(pos<lastPos){ si=(si+1)%styles.length; ti=(ti+1)%themes.length;
          applyPalette([bases[ti%bases.length]]); applyTheme(themes[ti]); applyStyle(styles[si]); showLabel(); }
        lastPos=pos; S.progress=pos; S.polledAt=performance.now();
      },350);
    }

    const _params=new URLSearchParams(location.search);
    applyPalette(null); applyTheme('aurora'); setMode('idle');
    sizeFx(); requestAnimationFrame(drawFx); requestAnimationFrame(tick);

    if(_params.get('demo')){
      startDemo(_params.get('theme'), _params.get('style'));
    } else {
      poll(); setInterval(poll,3000);
      // Follow the wall "mode" from the phone remote.
      setInterval(async()=>{ try{ const m=(await(await fetch('/api/mode',{cache:'no-store'})).json()).mode; if(m&&m!=='music') location.href='/'; }catch(e){} },2000);
    }
  </script>
</body>
</html>
