<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Family Lists</title>
  <style>
    :root { --bg:#f7f2e9; --card:#ffffff; --ink:#2a2620; --muted:#93897a; --line:#ece4d4; --accent:#d1603f; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1c1a17; --card:#262320; --ink:#f0e9dd; --muted:#a89a86; --line:#39332b; --accent:#e5794f; }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin:0 auto; background:var(--bg); color:var(--ink); padding:18px 16px 44px; max-width:560px;
      font-family:-apple-system,"Segoe UI",system-ui,Roboto,sans-serif; }
    h1 { font-size:24px; margin:4px 0 20px; }
    section { margin-bottom:30px; }
    h2 { display:flex; align-items:center; gap:9px; font-size:18px; margin:0 0 12px; }
    h2 .ic { display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px;
      border-radius:10px; font-size:17px; }
    .ic.groc { background:#e3f3ea; } .ic.check { background:#e9e4f7; } .ic.notes { background:#fdeede; }
    form { display:flex; gap:8px; margin-bottom:12px; }
    input[type=text] { flex:1; font-size:17px; padding:13px 15px; border:1px solid var(--line);
      border-radius:13px; background:var(--card); color:var(--ink); }
    input[type=text]:focus { outline:2px solid var(--accent); border-color:var(--accent); }
    button.add { font-size:16px; font-weight:700; border:none; border-radius:13px; padding:0 20px;
      background:var(--accent); color:#fff; cursor:pointer; }
    ul { list-style:none; margin:0; padding:0; }
    li { display:flex; align-items:center; gap:13px; padding:13px 4px; border-bottom:1px solid var(--line); }
    li .box { width:26px; height:26px; border-radius:8px; border:2px solid var(--line); flex:none;
      display:flex; align-items:center; justify-content:center; font-size:15px; color:#fff; cursor:pointer; }
    li.done .box { background:var(--accent); border-color:var(--accent); }
    li .t { flex:1; font-size:17px; }
    li.done .t { text-decoration:line-through; color:var(--muted); }
    li .del { color:var(--muted); font-size:24px; line-height:1; background:none; border:none; padding:2px 6px; cursor:pointer; }
    .empty { color:var(--muted); padding:22px 0; text-align:center; }
    .bar { display:flex; justify-content:space-between; align-items:center; margin-top:12px;
      color:var(--muted); font-size:14px; }
    .bar button { background:none; border:none; color:var(--accent); font-weight:700; font-size:14px; padding:6px 2px; cursor:pointer; }
  </style>
</head>
<body>
  <h1>🏡 Family Lists</h1>

  <section>
    <h2><span class="ic groc">🛒</span>Grocery</h2>
    <form data-list="grocery"><input type="text" placeholder="Add an item…" autocomplete="off" autocapitalize="sentences" /><button type="submit" class="add">Add</button></form>
    <ul data-items="grocery"><li class="empty">Loading…</li></ul>
    <div class="bar"><span data-count="grocery"></span><button type="button" data-clear="grocery">Clear checked</button></div>
  </section>

  <section>
    <h2><span class="ic check">📋</span>Today's Checklist</h2>
    <form data-list="checklist"><input type="text" placeholder="Add a to-do…" autocomplete="off" autocapitalize="sentences" /><button type="submit" class="add">Add</button></form>
    <ul data-items="checklist"><li class="empty">Loading…</li></ul>
    <div class="bar"><span data-count="checklist"></span><button type="button" data-clear="checklist">Clear checked</button></div>
  </section>

  <section>
    <h2><span class="ic notes">💌</span>Family Notes</h2>
    <form data-list="notes"><input type="text" placeholder="Leave a note 💛" autocomplete="off" autocapitalize="sentences" /><button type="submit" class="add">Post</button></form>
    <ul data-items="notes"><li class="empty">Loading…</li></ul>
    <div class="bar"><span data-count="notes"></span><button type="button" data-clear="notes">Clear all</button></div>
  </section>

  <script>
    function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    async function api(path, body){
      const o = { method: body ? 'POST' : 'GET' };
      if (body) { o.headers = {'Content-Type':'application/json'}; o.body = JSON.stringify(body); }
      return (await fetch(path, o)).json();
    }

    function makeList(name, opts){
      opts = opts || {};
      const check = opts.check !== false;             // notes pass check:false
      const base = '/api/' + name;
      const ul = document.querySelector(`[data-items="${name}"]`);
      const countEl = document.querySelector(`[data-count="${name}"]`);
      const render = d => {
        const items = d.items || [];
        if (check) {
          countEl.textContent = items.length ? `${items.filter(i => !i.checked).length} to go · ${items.length} total` : '';
        } else {
          countEl.textContent = items.length ? `${items.length} note${items.length !== 1 ? 's' : ''}` : '';
        }
        ul.innerHTML = items.length ? items.map(i => `
          <li class="${check && i.checked ? 'done' : ''}">
            ${check ? `<span class="box" data-toggle="${i.id}">${i.checked ? '✓' : ''}</span>` : ''}
            <span class="t">${esc(i.text)}</span>
            <button class="del" data-del="${i.id}" aria-label="delete">×</button>
          </li>`).join('') : `<li class="empty">${check ? 'Nothing here yet' : 'No notes yet 💌'}</li>`;
      };
      const refresh = async () => render(await api(base));
      ul.addEventListener('click', async e => {
        const tg = e.target.closest('[data-toggle]'); const dl = e.target.closest('[data-del]');
        if (tg) render(await api(base + '/toggle', { id: tg.dataset.toggle }));
        else if (dl) render(await api(base + '/remove', { id: dl.dataset.del }));
      });
      document.querySelector(`form[data-list="${name}"]`).addEventListener('submit', async e => {
        e.preventDefault();
        const inp = e.target.querySelector('input');
        const v = inp.value.trim(); if (!v) return;
        inp.value = ''; render(await api(base + '/add', { text: v })); inp.focus();
      });
      document.querySelector(`[data-clear="${name}"]`).addEventListener('click', async () => {
        render(await api(base + '/clear', { clear: true }));
      });
      refresh(); setInterval(refresh, 5000);
    }

    makeList('grocery');
    makeList('checklist');
    makeList('notes', { check: false });
  </script>
</body>
</html>
